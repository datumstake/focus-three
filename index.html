<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusThree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #fafafa; --text: #333; --accent: #2d7dd2; --accent-soft: #e3f0ff; --border: #ddd; --done-bg: #f0f0f0; --done-text: #888; --error: #d32f2f; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --text: #e0e0e0; --accent: #64b5f6; --accent-soft: #1e3a5f; --border: #444; --done-bg: #2a2a2a; --done-text: #aaa; --error: #ef5350; } }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem; max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.8rem; margin-bottom: 0.25rem; color: var(--text); }
.tagline { color: var(--done-text); margin-bottom: 1.5rem; font-size: 0.95rem; }
.section { margin-bottom: 2rem; }
.section h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--accent); }
.task-slot { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); transition: background 0.2s; }
.task-slot.done { background: var(--done-bg); opacity: 0.7; }
.task-slot:hover { background: var(--accent-soft); }
.task-slot input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
.task-slot input[type="text"] { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 1rem; }
.task-slot input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
.task-slot input[type="text"].done { text-decoration: line-through; color: var(--done-text); }
.timer-section { text-align: center; padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.timer-display { font-size: 3.5rem; font-weight: 300; font-variant-numeric: tabular-nums; margin-bottom: 1rem; color: var(--accent); text-align: center; }
.timer-controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.btn { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 0.9rem; cursor: pointer; transition: all 0.15s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #1a6fd6; border-color: #1a6fd6; }
.timer-presets { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.timer-presets .btn { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
.timer-presets .btn:hover { background: var(--accent-soft); }
.custom-input { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.custom-input input { width: 60px; padding: 0.4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); text-align: center; font-size: 1rem; }
.custom-input input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.cue { animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<h1>FocusThree</h1>
<p class="tagline">Three tasks. One timer. Nothing else.</p>

<div class="section">
<h2>Today's Three Tasks</h2>
<div class="task-slot" id="task1"><input type="checkbox" id="t1c"><input type="text" id="t1t" placeholder="Task 1"></div>
<div class="task-slot" id="task2"><input type="checkbox" id="t2c"><input type="text" id="t2t" placeholder="Task 2"></div>
<div class="task-slot" id="task3"><input type="checkbox" id="t3c"><input type="text" id="t3t" placeholder="Task 3"></div>
</div>

<div class="section">
<h2>Focus Timer</h2>
<div class="timer-section">
<div class="timer-display" id="timerDisplay">25:00</div>
<div class="timer-presets">
<button class="btn" data-min="10">10 min</button>
<button class="btn" data-min="15">15 min</button>
<button class="btn" data-min="25">25 min</button>
</div>
<div class="custom-input">
<input type="number" id="customMin" min="1" max="180" value="25">
<span>minutes</span>
</div>
<div class="timer-controls">
<button class="btn btn-primary" id="startBtn">Start</button>
<button class="btn" id="pauseBtn" disabled>Pause</button>
<button class="btn" id="resetBtn">Reset</button>
</div>
</div>
</div>

<script>
(function() {
const STORAGE_KEY = 'focusthree-data';
const AUDIO_KEY = 'focusthree-audio';

let timerInterval = null;
let timeLeft = 25 * 60;
let isRunning = false;

const els = {
  timerDisplay: document.getElementById('timerDisplay'),
  customMin: document.getElementById('customMin'),
  startBtn: document.getElementById('startBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  resetBtn: document.getElementById('resetBtn'),
  task1: { slot: document.getElementById('task1'), c: document.getElementById('t1c'), t: document.getElementById('t1t') },
  task2: { slot: document.getElementById('task2'), c: document.getElementById('t2c'), t: document.getElementById('t2t') },
  task3: { slot: document.getElementById('task3'), c: document.getElementById('t3c'), t: document.getElementById('t3t') }
};

function loadState() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (data.tasks) {
      [1, 2, 3].forEach(i => {
        const task = els['task' + i];
        const saved = data.tasks[i - 1] || {};
        task.c.checked = saved.done || false;
        task.t.value = saved.text || '';
        reflectDone(i);
      });
    }
    if (data.timerMinutes) {
      els.customMin.value = data.timerMinutes;
      timeLeft = data.timerMinutes * 60;
    }
    updateDisplay();
  } catch (e) { console.error('Load error:', e); }
}

function saveState() {
  const data = {
    tasks: [1, 2, 3].map(i => ({ done: els['task' + i].c.checked, text: els['task' + i].t.value })),
    timerMinutes: parseInt(els.customMin.value, 10) || Math.max(1, Math.floor(timeLeft / 60))
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Reflect a task's checked state into its styling. The 'change' event has
// already set .checked for us — we only read it, never flip it.
function reflectDone(index) {
  const task = els['task' + index];
  task.t.classList.toggle('done', task.c.checked);
  task.slot.classList.toggle('done', task.c.checked);
}

function syncTask(index) {
  reflectDone(index);
  saveState();
}

function updateDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  els.timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function startTimer() {
  if (isRunning) return;
  if (timeLeft <= 0) resetTimer();
  isRunning = true;
  els.startBtn.disabled = true;
  els.pauseBtn.disabled = false;
  timerInterval = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
      updateDisplay();
    } else {
      completeTimer();
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  els.startBtn.disabled = false;
  els.pauseBtn.disabled = true;
}

function resetTimer() {
  pauseTimer();
  const mins = parseInt(els.customMin.value, 10) || 25;
  timeLeft = mins * 60;
  updateDisplay();
  saveState();
}

function completeTimer() {
  pauseTimer();
  playCue();
  els.timerDisplay.classList.add('cue');
  setTimeout(() => els.timerDisplay.classList.remove('cue'), 2000);
}

function playCue() {
  if (localStorage.getItem(AUDIO_KEY) === 'false') return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch (e) { /* ignore audio errors */ }
}

function setPreset(mins) {
  els.customMin.value = mins;
  resetTimer();
}

function init() {
  loadState();

  [1, 2, 3].forEach(i => {
    const task = els['task' + i];
    task.c.addEventListener('change', () => syncTask(i));
    task.t.addEventListener('input', () => syncTask(i));
  });

  document.querySelectorAll('.timer-presets .btn').forEach(btn => {
    btn.addEventListener('click', () => setPreset(parseInt(btn.dataset.min, 10)));
  });

  els.startBtn.addEventListener('click', startTimer);
  els.pauseBtn.addEventListener('click', pauseTimer);
  els.resetBtn.addEventListener('click', resetTimer);
  els.customMin.addEventListener('change', resetTimer);
}

init();
})();
</script>
</body>
</html>
